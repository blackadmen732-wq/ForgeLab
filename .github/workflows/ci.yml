name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # Unit, integration, RLS (PGlite) and verification tests.
      - run: pnpm test
      # Builds the SPA and the Vercel Build Output (bundles /api/verify and scans the
      # browser bundle for leaked secret keys).
      - run: pnpm vercel-build

  e2e:
    name: Acceptance test (local Supabase + production build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase (applies supabase/migrations)
        run: supabase start -x studio,imgproxy,mailpit,postgres-meta,supavisor,logflare,vector
      - name: Export local Supabase keys
        run: |
          supabase status -o env \
            | sed -n -e 's/^API_URL=/SUPABASE_URL=/p' -e 's/^PUBLISHABLE_KEY=/VITE_SUPABASE_PUBLISHABLE_KEY=/p' -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
      - name: Build against it
        run: |
          echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          VITE_SUPABASE_URL="$SUPABASE_URL" VITE_SITE_URL=http://localhost:3000 pnpm vercel-build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Serve the build and run the acceptance test
        run: |
          node scripts/serve-output.mjs 3000 &
          sleep 2
          mkdir -p e2e-shots
          E2E_SHOTS=e2e-shots node e2e/acceptance.mjs http://localhost:3000
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots
